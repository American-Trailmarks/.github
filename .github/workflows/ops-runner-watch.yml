name: Ops / Runner watch

on:
  pull_request:
    paths:
      - ".github/workflows/ops-runner-watch.yml"
      - "scripts/ops-runner-watch.mjs"
      - "docs/ops-runner-watch.md"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-runner-watch
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate monitor script
        run: node --check scripts/ops-runner-watch.mjs

  monitor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPS_MONITOR_GITHUB_TOKEN: ${{ secrets.OPS_MONITOR_GITHUB_TOKEN }}
      OPS_MONITOR_REPOSITORIES: ${{ secrets.OPS_MONITOR_REPOSITORIES }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      OPS_QUEUE_THRESHOLD_MINUTES: "15"
      OPS_MONITOR_STATE_PATH: .state/ops-runner-watch.hash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore prior alert fingerprint
        uses: actions/cache/restore@v4
        with:
          path: .state/ops-runner-watch.hash
          key: ops-runner-watch-${{ github.run_id }}
          restore-keys: |
            ops-runner-watch-

      - name: Check cross-repository runner and queue health
        run: |
          mkdir -p .state
          node scripts/ops-runner-watch.mjs

      - name: Save alert fingerprint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/ops-runner-watch.hash
          key: ops-runner-watch-${{ github.run_id }}
